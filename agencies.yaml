# Evidence ledger for Claude SEO vendors.
#
# Every field is a fact you can check on the vendor's own page, read on
# 29 October 2026. There are no scores. The "open questions" column in the
# README is computed by render_table.py from the booleans below, so a vendor
# that publishes new proof loses its open question the moment you flip a flag.
#
# Field reference
#   delivery              software | agency
#   price                 what the vendor publishes, verbatim where possible
#   price_published       true when a number appears on the vendor's own site
#   claude_isolated       true when results are reported for Claude alone,
#                         not blended into an "AI" or "LLM" total
#   named_proof           named client results shown on the Claude page
#   crawler_agents        user agents the vendor's Claude page names
#   mcp                   vendor scopes Model Context Protocol work
#   tracking              how Claude visibility gets measured

